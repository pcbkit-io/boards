# Every board of the library through PCBKit's gate (github.com/pcbkit-io/verify), in report mode:
# the run's summary shows each board's level, findings and what each level judged; a pull request
# gets one comment with what it did to each board it changes. The job never fails on findings.
name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pcbkit-io/verify@v0
        with:
          projects: "*/*"
          require: ready
          policy: report
