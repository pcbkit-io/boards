# docs: https://pcbkit.dev (the kicad-boards skill, reference/device.md)
processors: 
  U1: 
    parameters: { flash_mib: 16, gpios: 48, psram_cs: 47, psram_mib: 8 }
    firmware: doom
    data: 
      DOOM1.WAD: { url: "https://raw.githubusercontent.com/Akbar30Bill/DOOM_wads/9b384dc68add3eb2f5eb7754654cafeeaea5103b/doom1.wad", sha256: "1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771", bytes: 4196020 }
