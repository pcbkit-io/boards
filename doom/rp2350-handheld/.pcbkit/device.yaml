  lcd: 
    parameters: { height_mm: 57.6, offset_x_mm: 0, offset_y_mm: 45.9, width_mm: 43.2 }
keys: 
  ArrowUp: up
  ArrowDown: down
  ArrowLeft: left
  ArrowRight: right
  Comma: strafeLeft
  Period: strafeRight
  KeyF: fire
  Space: use
  KeyM: menu
  Enter: enter
