; The sketch as a PlatformIO project: built for the board's Arduino Nano (ATmega328P, 16 MHz)
; with the libraries it includes. `pcbkit device build` runs `pio run` here; the image it leaves
; (.pio/build/nano/firmware.hex) is what the device runs and what is flashed.
[platformio]
src_dir = .

[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps =
    adafruit/Adafruit GFX Library@^1.11
    adafruit/Adafruit BusIO@^1.16
    adafruit/Adafruit SSD1306@^2.5
    adafruit/Adafruit SHT31 Library@^2.2
