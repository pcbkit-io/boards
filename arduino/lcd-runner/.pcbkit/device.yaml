# What the board cannot say of the device it is: programs, their data, models' parameters, keys.
# docs: https://pcbkit.dev (the kicad-boards skill, reference/device.md)
processors: 
  NANO: 
    parameters: { clock_hz: 16000000 }
    firmware: firmware
parts: 
  DS1: 
    parameters: { columns: 16, height_mm: 11.5, offset_x_mm: 12.95, offset_y_mm: -16, rows: 2, width_mm: 56.2 }
  RV1: 
    parameters: { ohms: 10000, position: 0.5, volts: 5 }
